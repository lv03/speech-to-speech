<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>speech-to-speech</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="desktop-shell">
      <div class="orb-anchor">
        <section id="orb-stage" class="orb-stage" title="speech-to-speech">
          <canvas id="sprite-canvas" class="sprite-canvas hidden" width="120" height="120"></canvas>
          <div id="orb" class="orb">
            <div class="orb-glow"></div>
            <div id="orb-status" class="orb-status" title="Gateway 状态"></div>
            <div class="orb-label">s2s</div>
          </div>
          <nav class="orb-controls" aria-label="控制">
            <button id="btn-mic" class="control" title="麦克风" aria-label="麦克风">
              <svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3m-3 0h6"/></svg>
            </button>
            <button id="btn-settings" class="control" title="设置" aria-label="设置">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2 2 0 0 1-2.83 2.83l-.04-.04a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.08 1.65V21a2 2 0 0 1-4 0v-.06A1.8 1.8 0 0 0 8.8 19.3a1.8 1.8 0 0 0-1.98.36l-.04.04a2 2 0 0 1-2.83-2.83l.04-.04a1.8 1.8 0 0 0 .36-1.98A1.8 1.8 0 0 0 2.7 13.8H2.6a2 2 0 0 1 0-4h.06A1.8 1.8 0 0 0 4.3 8.72a1.8 1.8 0 0 0-.36-1.98l-.04-.04a2 2 0 0 1 2.83-2.83l.04.04a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 9.82 2.6V2.5a2 2 0 0 1 4 0v.06A1.8 1.8 0 0 0 14.9 4.2a1.8 1.8 0 0 0 1.98-.36l.04-.04a2 2 0 0 1 2.83 2.83l-.04.04a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.08h.1a2 2 0 0 1 0 4h-.06A1.8 1.8 0 0 0 19.4 15Z"/></svg>
            </button>
            <button id="btn-tasks" class="control" title="后台任务" aria-label="后台任务">
              <svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></svg>
            </button>
            <button id="btn-quit" class="control danger" title="退出" aria-label="退出">
              <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>
            </button>
          </nav>
        </section>
      </div>
      <section id="task-stack" class="task-stack" aria-label="后台任务" aria-live="polite"></section>
    </main>

    <script type="module" src="./orb.ts"></script>
  </body>
</html>
