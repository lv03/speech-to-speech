appId: com.speech-to-speech.desktop
productName: speech-to-speech
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/qmd-resources
    to: qmd
  - from: build/runtime-manifest.json
    to: runtime-manifest.json
  - from: build/runtime
    to: runtime
  - from: scripts/verify-package.mjs
    to: verify-package.mjs
asar: true
asarUnpack:
  - "**/*.node"
  - "qmd/**/*.node"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  identity: null
  notarize: false
electronLanguages:
  - en
  - zh_CN
