appId: com.speech-to-speech.desktop
productName: speech-to-speech
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/qmd-resources
    to: qmd
    filter:
      - '**/*'
  - from: build/qmd-resources/node_modules
    to: qmd/node_modules
    filter:
      - '**/*'
  - from: build/runtime-manifest.json
    to: runtime-manifest.json
  - from: build/runtime-manifest.json.sig
    to: runtime-manifest.json.sig
  - from: build/runtime
    to: runtime
  - from: scripts/verify-package.mjs
    to: verify-package.mjs
asar: true
asarUnpack:
  - "**/*.node"
  - "qmd/**/*.node"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  minimumSystemVersion: "15.0.0"
electronLanguages:
  - en
  - zh_CN
